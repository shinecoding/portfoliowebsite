  <text x="130" y="300" fill="#a39b91" font-size="22">views.py · legacy</text>
  <text x="130" y="370" fill="#f5efe7" font-size="26"><tspan fill="#f2a48f">def</tspan> product_list(request):</text>
  <text x="160" y="420" fill="#f5efe7" font-size="26">items = Product.objects</text>
  <text x="190" y="470" fill="#f5efe7" font-size="26">.filter(vendor=v,</text>
  <text x="220" y="520" fill="#f5efe7" font-size="26">category=<tspan fill="#f2a48f">"dresses"</tspan>)</text>
  <text x="160" y="590" fill="#f5efe7" font-size="26"><tspan fill="#f2a48f">return</tspan> render(request,</text>
  <text x="190" y="640" fill="#f5efe7" font-size="26"><tspan fill="#f2a48f">"catalog.html"</tspan>, ...)</text>

  <!-- arrow -->
